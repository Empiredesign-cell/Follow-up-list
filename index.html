                                                <div className="absolute -top-20 left-1/2 transform -translate-x-1/2 w-48 h-48 character-img transition-transform duration-300 pointer-events-none z-20">
                                                    {AvatarComp ? <AvatarComp /> : <Avatars.boy />}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* BAGIAN KANAN: SIDEBAR TITIPAN WEEKEND BERUPA STICKY NOTES */}
                            <div className="w-full xl:w-[350px] shrink-0 bg-white/60 dark:bg-gray-800/60 backdrop-blur-xl border border-white dark:border-gray-700 rounded-3xl p-5 shadow-2xl flex flex-col min-h-[500px] xl:sticky top-12">
                                <div className="flex items-center gap-3 mb-6 border-b-2 border-dashed border-indigo-200 dark:border-gray-600 pb-4">
                                    <div className="p-2 bg-indigo-100 dark:bg-indigo-900/50 rounded-xl text-indigo-600 dark:text-indigo-400">
                                        <ListIcon size={24} />
                                    </div>
                                    <div>
                                        <h2 className="text-lg font-black text-gray-800 dark:text-gray-100 leading-none">Titipan Weekend</h2>
                                        <p className="text-[10px] font-bold text-rose-500 mt-1 uppercase tracking-wider">Otomatis bersih tiap Senin!</p>
                                    </div>
                                </div>
                                
                                <button onClick={addWeekendNote} className="w-full py-3 mb-6 border-2 border-dashed border-indigo-300 dark:border-indigo-600/50 rounded-2xl text-indigo-500 dark:text-indigo-400 font-bold hover:bg-indigo-50 dark:hover:bg-indigo-900/40 transition-colors flex items-center justify-center gap-2 shadow-sm">
                                    <Plus size={20}/> Buat Titipan Baru
                                </button>

                                <div className="flex-1 overflow-y-auto hide-scrollbar space-y-4 pr-1">
                                    {weekendNotes.length === 0 ? (
                                        <div className="h-40 flex flex-col items-center justify-center text-gray-400 dark:text-gray-500 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-2xl p-4 text-center mt-2">
                                            <span className="text-3xl mb-2">🏖️</span>
                                            <p className="text-xs font-medium">Belum ada titipan.<br/>Silakan buat untuk dikerjakan weekend!</p>
                                        </div>
                                    ) : (
                                        weekendNotes.map((note) => (
                                            <TearableStickyNote 
                                                key={note.id} 
                                                id={note.id}
                                                initialColor={note.color} 
                                                initialTitle={note.title} 
                                                initialText={note.content} 
                                                onUpdate={updateWeekendNote} 
                                                onDelete={deleteWeekendNote}
                                                onTear={() => deleteWeekendNote(note.id)} /* Tombol Refresh (Tear) akan menghapusnya dari daftar */
                                            />
                                        ))
                                    )}
                                </div>
                            </div>
                            
                        </div>

                        {showAdminLogin && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                                <div className="absolute inset-0 bg-black/60 backdrop-blur-md" onClick={() => setShowAdminLogin(false)}></div>
                                <div className="bg-white dark:bg-gray-800 w-full max-w-sm rounded-[2.5rem] shadow-2xl relative p-8 pop-in-animation flex flex-col items-center z-10">
                                    <div className="w-16 h-16 bg-blue-100 dark:bg-blue-900/50 rounded-full flex items-center justify-center mb-4"><KeyIcon size={32} className="text-blue-500" /></div>
                                    <h2 className="text-2xl font-black text-gray-800 dark:text-gray-100 mb-2">Akses Admin</h2>
                                    <p className="text-gray-500 dark:text-gray-400 text-sm mb-6 text-center">Masukkan password untuk mengedit dan membuat workspace.</p>
                                    <form onSubmit={(e) => { e.preventDefault(); if (adminPassword === 'ciptadigi') { setIsAdmin(true); setShowAdminLogin(false); setAdminPassword(''); setAdminError(false); } else { setAdminError(true); setAdminPassword(''); } }} className="w-full">
                                        <input autoFocus type="password" value={adminPassword} onChange={(e) => { setAdminPassword(e.target.value); setAdminError(false); }} placeholder="Password..." className={`w-full bg-gray-100 dark:bg-gray-700 px-6 py-4 rounded-2xl outline-none text-center font-bold tracking-widest text-gray-800 dark:text-gray-100 mb-2 border-2 ${adminError ? 'border-red-500' : 'border-transparent focus:border-blue-400'}`}/>
                                        <div className="h-6 mb-4 flex items-center justify-center">{adminError && <span className="text-red-500 text-xs font-bold pop-in-animation">Password Salah!</span>}</div>
                                        <div className="flex gap-3 w-full">
                                            <button type="button" onClick={() => setShowAdminLogin(false)} className="flex-1 py-3 bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded-2xl font-bold hover:bg-gray-300 dark:hover:bg-gray-600">Batal</button>
                                            <button type="submit" className="flex-1 py-3 bg-blue-500 text-white rounded-2xl font-bold hover:bg-blue-600 shadow-md">Masuk</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {isModalOpen && isAdmin && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                                <div className="absolute inset-0 bg-black/50 backdrop-blur-sm" onClick={() => setIsModalOpen(false)}></div>
                                <div className="bg-white dark:bg-gray-800 w-full max-w-md rounded-[2.5rem] shadow-2xl relative p-6 pop-in-animation flex flex-col items-center z-10">
                                    <h2 className="text-2xl font-black text-gray-800 dark:text-gray-100 mb-4">{editingId ? "Edit Workspace" : "Pilih Karaktermu"}</h2>
                                    <div className="grid grid-cols-4 md:grid-cols-4 gap-3 mb-4 w-full max-h-48 overflow-y-auto p-2 hide-scrollbar border border-gray-100 dark:border-gray-700 rounded-xl">
                                        {Object.keys(Avatars).map(avKey => {
                                            const AvatarC = Avatars[avKey];
                                            return (
                                                <button key={avKey} type="button" onClick={() => setSelectedAvatar(avKey)} className={`p-2 rounded-2xl border-4 transition-all ${selectedAvatar === avKey ? 'border-purple-500 bg-purple-50 dark:bg-purple-900/20 scale-105 shadow-md' : 'border-transparent hover:bg-gray-50 dark:hover:bg-gray-700'}`}><div className="w-12 h-12 md:w-14 md:h-14 mx-auto"><AvatarC /></div></button>
                                            );
                                        })}
                                    </div>
                                    <div className="flex flex-wrap justify-center gap-2 mb-6 w-full max-h-24 overflow-y-auto p-2 hide-scrollbar">
                                        {Gradients.map(g => (<button key={g.id} type="button" onClick={() => setSelectedGradient(g)} className={`w-8 h-8 rounded-full bg-gradient-to-b ${g.classes} transition-transform border-2 ${selectedGradient.id === g.id ? 'scale-125 border-gray-800 dark:border-white shadow-md' : 'border-transparent hover:scale-110'}`}></button>))}
                                    </div>
                                    <form onSubmit={handleSaveFolder} className="w-full">
                                        <div className="relative w-full mb-4">
                                            <input autoFocus type="text" value={newFolderName} onChange={(e) => setNewFolderName(e.target.value)} placeholder="Nama Workspace..." className="w-full bg-gray-100 dark:bg-gray-700 pl-6 pr-12 py-4 rounded-2xl outline-none text-center font-bold text-gray-800 dark:text-gray-100 border-2 border-transparent focus:border-purple-400"/>
                                            <button type="button" onClick={() => setShowPinInput(!showPinInput)} className={`absolute right-4 top-1/2 transform -translate-y-1/2 p-2 rounded-full transition-colors ${showPinInput || folderPin ? 'text-purple-500 bg-purple-100 dark:bg-purple-900/50' : 'text-gray-400 hover:text-purple-400'}`} title="Set PIN Rahasia"><LockIcon size={18} /></button>
                                        </div>
                                        {showPinInput && (
                                            <div className="w-full mb-4 pop-in-animation">
                                                <input type="password" value={folderPin} onChange={(e) => setFolderPin(e.target.value)} placeholder="PIN Rahasia (Kosongkan jika tidak mau)..." className="w-full bg-purple-50 dark:bg-gray-800 border-2 border-purple-200 dark:border-gray-600 px-6 py-4 rounded-2xl outline-none text-center font-bold text-purple-700 dark:text-purple-300 focus:border-purple-500" />
                                            </div>
                                        )}
                                        <div className="flex gap-3 w-full">
                                            <button type="button" onClick={() => setIsModalOpen(false)} className="flex-1 py-3 bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded-2xl font-bold hover:bg-gray-300 dark:hover:bg-gray-600">Batal</button>
                                            <button type="submit" className="flex-1 py-3 bg-purple-500 text-white rounded-2xl font-bold hover:bg-purple-600 shadow-md">Simpan</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {unlockingFolder && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                                <div className="absolute inset-0 bg-black/60 backdrop-blur-md" onClick={() => setUnlockingFolder(null)}></div>
                                <div className="bg-white dark:bg-gray-800 w-full max-w-sm rounded-[2.5rem] shadow-2xl relative p-8 pop-in-animation flex flex-col items-center z-10">
                                    <div className="w-16 h-16 bg-red-100 dark:bg-red-900/50 rounded-full flex items-center justify-center mb-4"><LockIcon size={32} className="text-red-500" /></div>
                                    <h2 className="text-2xl font-black text-gray-800 dark:text-gray-100 mb-2">Folder Terkunci</h2>
                                    <p className="text-gray-500 dark:text-gray-400 text-sm mb-6 text-center">Masukkan PIN untuk membuka <br/><b>{unlockingFolder.name}</b></p>
                                    <form onSubmit={(e) => { e.preventDefault(); if (unlockPin === unlockingFolder.pin) { const target = unlockingFolder; setUnlockingFolder(null); onSelectFolder(target.id, target.name); } else { setUnlockError(true); setUnlockPin(''); } }} className="w-full">
                                        <input autoFocus type="password" value={unlockPin} onChange={(e) => { setUnlockPin(e.target.value); setUnlockError(false); }} placeholder="Masukkan PIN..." className={`w-full bg-gray-100 dark:bg-gray-700 px-6 py-4 rounded-2xl outline-none text-center font-bold tracking-widest text-gray-800 dark:text-gray-100 mb-2 border-2 ${unlockError ? 'border-red-500' : 'border-transparent focus:border-red-400'}`}/>
                                        <div className="h-6 mb-4 flex items-center justify-center">{unlockError && <span className="text-red-500 text-xs font-bold pop-in-animation">PIN Salah! Silakan coba lagi.</span>}</div>
                                        <div className="flex gap-3 w-full">
                                            <button type="button" onClick={() => setUnlockingFolder(null)} className="flex-1 py-3 bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded-2xl font-bold hover:bg-gray-300 dark:hover:bg-gray-600">Batal</button>
                                            <button type="submit" className="flex-1 py-3 bg-red-500 text-white rounded-2xl font-bold hover:bg-red-600 shadow-md">Buka</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}
                        
                    </div>
                </div>
            );
        };

        function App() {
            const [authReady, setAuthReady] = useState(false);
            const [user, setUser] = useState(null);
            const [currentFolder, setCurrentFolder] = useState(null); 
            const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('followUpDarkMode') === 'true');

            useEffect(() => { localStorage.setItem('followUpDarkMode', isDarkMode); }, [isDarkMode]);

            useEffect(() => {
                signInAnonymously(auth).catch(e => console.error("Auth failed:", e));
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    if (currentUser) {
                        setUser(currentUser);
                        setAuthReady(true);
                    }
                });
                return () => unsubscribe();
            }, []);

            if (!authReady) {
                return (
                    <div className={isDarkMode ? 'dark' : ''}>
                        <div className="min-h-screen flex flex-col items-center justify-center bg-[#e2ddf8] dark:bg-gray-900 text-purple-600 dark:text-purple-400 font-bold text-xl gap-4">
                            <Loader size={48} className="animate-spin" />
                            <p className="animate-pulse">Menghubungkan ke Awan...</p>
                        </div>
                    </div>
                );
            }

            if (currentFolder) {
                return (
                    <BoardScreen 
                        folderId={currentFolder.id} 
                        folderName={currentFolder.name} 
                        onBack={() => setCurrentFolder(null)}
                        isDarkMode={isDarkMode}
                        setIsDarkMode={setIsDarkMode}
                    />
                );
            }

            return (
                <HomeScreen 
                    onSelectFolder={(id, name) => setCurrentFolder({ id, name })} 
                    isDarkMode={isDarkMode}
                    setIsDarkMode={setIsDarkMode}
                />
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
