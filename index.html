<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Follow Up List</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <!-- React & ReactDOM (UMD Build) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel untuk menerjemahkan JSX di browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Custom CSS -->
    <style>
        @keyframes tearOff {
            0% {
                transform: rotate(0deg) translateY(0) scale(1);
                opacity: 1;
                transform-origin: top left;
                filter: drop-shadow(0 10px 8px rgb(0 0 0 / 0.04));
            }
            20% {
                transform: rotate(-5deg) translateY(10px) scale(1.05);
                filter: drop-shadow(0 20px 13px rgb(0 0 0 / 0.1));
            }
            100% {
                transform: rotate(-35deg) translateY(800px) scale(0.9);
                opacity: 0;
                filter: drop-shadow(0 0px 0px rgb(0 0 0 / 0));
            }
        }

        .sticky-tear-animation {
            animation: tearOff 0.8s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards;
            pointer-events: none;
            z-index: 50;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            transition: all 0.3s ease;
        }
        
        .dark .glass-panel {
            background: rgba(31, 41, 55, 0.4);
            border: 1px solid rgba(75, 85, 99, 0.6);
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- PENGGANTI IKON LUCIDE-REACT (MENGGUNAKAN SVG INLINE) ---
        const Icon = ({ size = 24, className = "", children }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></Icon>;
        const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></Icon>;
        const RotateCcw = (p) => <Icon {...p}><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></Icon>;
        const Trash2 = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></Icon>;
        const Archive = (p) => <Icon {...p}><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></Icon>;
        const ChevronLeft = (p) => <Icon {...p}><polyline points="15 18 9 12 15 6"></polyline></Icon>;
        const ChevronRight = (p) => <Icon {...p}><polyline points="9 18 15 12 9 6"></polyline></Icon>;
        const Calendar = (p) => <Icon {...p}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></Icon>;
        const Sun = (p) => <Icon {...p}><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></Icon>;
        const Moon = (p) => <Icon {...p}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></Icon>;
        const PenTool = (p) => <Icon {...p}><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></Icon>;
        const GripVertical = (p) => <Icon {...p}><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="5" r="1"></circle><circle cx="9" cy="19" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="5" r="1"></circle><circle cx="15" cy="19" r="1"></circle></Icon>;


        // --- HELPER UNTUK TANGGAL ---
        const getTodayKey = () => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        const formatDateDisplay = (dateStr) => {
            if (!dateStr) return '';
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateStr).toLocaleDateString('id-ID', options);
        };

        // --- KOMPONEN STICKY NOTE ABSURD ---
        const TearableStickyNote = ({ id, initialColor, initialTitle, initialText, onUpdate, onTear, onDelete }) => {
            const [isTearing, setIsTearing] = useState(false);
            const [content, setContent] = useState(initialText);
            const [title, setTitle] = useState(initialTitle);
            const noteRef = useRef(null);

            const handleTear = () => {
                if (!title && !content) return; // Jangan sobek kertas kosong
                setIsTearing(true);
                
                // Simpan ke arsip
                onTear({ id, title, content, color: initialColor, tornAt: new Date().toISOString() });

                setTimeout(() => {
                    setContent('');
                    setIsTearing(false);
                    onUpdate(id, title, ''); // Kosongkan visual
                }, 800);
            };

            const handleChange = (e) => {
                setContent(e.target.value);
                onUpdate(id, title, e.target.value);
            };

            const handleTitleChange = (e) => {
                setTitle(e.target.value);
                onUpdate(id, e.target.value, content);
            }

            return (
                <div className="relative mb-6">
                {isTearing && (
                    <div className={`absolute inset-0 ${initialColor} shadow-md rounded-br-3xl p-4 flex flex-col z-0 opacity-50`}>
                        <div className="font-bold text-gray-800 dark:text-gray-100 mb-2">{title}</div>
                        <div className="flex-1 border-dashed border-2 border-black/10 dark:border-white/10 rounded"></div>
                    </div>
                )}

                <div 
                    ref={noteRef}
                    className={`
                    ${initialColor} shadow-lg hover:shadow-xl transition-all duration-300 
                    rounded-br-[2rem] p-4 flex flex-col min-h-[200px] relative z-10 group
                    ${isTearing ? 'sticky-tear-animation' : ''}
                    `}
                >
                    <div className="absolute bottom-0 right-0 w-8 h-8 bg-black/10 dark:bg-black/30 rounded-tl-[2rem] rounded-br-[2rem]"></div>

                    {/* Tombol Hapus Penuh */}
                    <button 
                    onClick={() => onDelete(id)}
                    className="absolute -top-2 -right-2 bg-red-400 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity shadow-md hover:bg-red-500 z-20"
                    title="Buang kertas ini"
                    >
                    <X size={14} />
                    </button>

                    <div className="flex justify-between items-center mb-2 border-b border-black/10 dark:border-black/20 pb-2">
                    <input 
                        type="text" 
                        value={title} 
                        onChange={handleTitleChange}
                        className="font-bold text-gray-800 dark:text-gray-100 bg-transparent outline-none w-full placeholder-gray-500 dark:placeholder-gray-400"
                        placeholder="Judul..."
                    />
                    <button 
                        onClick={handleTear}
                        title="Sobek & Simpan di Arsip!"
                        className="text-gray-500 dark:text-gray-300 hover:text-red-500 dark:hover:text-red-400 transition-colors p-1 rounded-full hover:bg-black/5 dark:hover:bg-white/10"
                    >
                        <RotateCcw size={16} />
                    </button>
                    </div>
                    
                    <textarea
                    value={content}
                    onChange={handleChange}
                    className="flex-1 w-full bg-transparent outline-none resize-none text-gray-700 dark:text-gray-200 leading-relaxed hide-scrollbar placeholder-gray-400 dark:placeholder-gray-400"
                    placeholder="Tulis sesuatu..."
                    />
                </div>
                </div>
            );
        };

        // --- KOMPONEN UTAMA APLIKASI ---
        function App() {
            const todayKey = getTodayKey();

            // 1. STATE: Dark Mode
            const [isDarkMode, setIsDarkMode] = useState(() => {
                const saved = localStorage.getItem('followUpDarkMode');
                return saved === 'true';
            });

            // 2. STATE: Kanban History
            const [tasksHistory, setTasksHistory] = useState(() => {
                const saved = localStorage.getItem('followUpTasksHistory_v3');
                if (saved) return JSON.parse(saved);
                return { [todayKey]: [] }; // Bersih!
            });

            const [viewDate, setViewDate] = useState(todayKey);

            // 3. STATE: Sticky Notes Aktif
            const [stickies, setStickies] = useState(() => {
                const saved = localStorage.getItem('followUpStickies_v3');
                if (saved) return JSON.parse(saved);
                return [
                { id: 's1', color: 'bg-yellow-200 dark:bg-yellow-900/60', title: '', content: '' },
                { id: 's2', color: 'bg-rose-200 dark:bg-rose-900/60', title: '', content: '' },
                ];
            });

            // 4. STATE: Arsip Sticky Notes
            const [archivedStickies, setArchivedStickies] = useState(() => {
                const saved = localStorage.getItem('followUpArchivedStickies_v3');
                if (saved) return JSON.parse(saved);
                return [];
            });

            const [isArchiveOpen, setIsArchiveOpen] = useState(false);
            const [newTaskInput, setNewTaskInput] = useState('');
            const [draggedTaskId, setDraggedTaskId] = useState(null);

            // --- EFEK LOGIKA PERGANTIAN HARI ---
            useEffect(() => {
                const checkAndShiftDay = () => {
                setTasksHistory(prevHistory => {
                    const historyKeys = Object.keys(prevHistory).sort();
                    if (!prevHistory[todayKey]) {
                    const lastDateKey = historyKeys[historyKeys.length - 1];
                    let carryOverTasks = [];
                    if (lastDateKey && prevHistory[lastDateKey]) {
                        carryOverTasks = prevHistory[lastDateKey]
                        .filter(task => task.status !== 'done')
                        .map(task => ({ ...task, id: `carry-${Date.now()}-${Math.random()}` }));
                    }
                    return { ...prevHistory, [todayKey]: carryOverTasks };
                    }
                    return prevHistory;
                });
                setViewDate(todayKey);
                };
                checkAndShiftDay();
            }, [todayKey]);

            // Simpan ke local storage
            useEffect(() => { localStorage.setItem('followUpDarkMode', isDarkMode); }, [isDarkMode]);
            useEffect(() => { localStorage.setItem('followUpTasksHistory_v3', JSON.stringify(tasksHistory)); }, [tasksHistory]);
            useEffect(() => { localStorage.setItem('followUpStickies_v3', JSON.stringify(stickies)); }, [stickies]);
            useEffect(() => { localStorage.setItem('followUpArchivedStickies_v3', JSON.stringify(archivedStickies)); }, [archivedStickies]);

            // --- KANBAN LOGIC ---
            const currentTasks = tasksHistory[viewDate] || [];

            const handleDragStart = (e, id) => {
                setDraggedTaskId(id);
                setTimeout(() => { e.target.style.opacity = '0.4'; }, 0);
            };
            const handleDragEnd = (e) => {
                e.target.style.opacity = '1';
                setDraggedTaskId(null);
            };
            const handleDragOver = (e) => e.preventDefault();

            const handleDrop = (e, status) => {
                e.preventDefault();
                if (draggedTaskId) {
                setTasksHistory(prev => ({
                    ...prev,
                    [viewDate]: prev[viewDate].map(task => 
                    task.id === draggedTaskId ? { ...task, status } : task
                    )
                }));
                }
            };

            const addTask = (e) => {
                e.preventDefault();
                if (!newTaskInput.trim()) return;
                const newTask = { id: Date.now().toString(), content: newTaskInput, status: 'todo' };
                setTasksHistory(prev => ({
                ...prev,
                [viewDate]: [newTask, ...(prev[viewDate] || [])]
                }));
                setNewTaskInput('');
            };

            const deleteTask = (id) => {
                setTasksHistory(prev => ({
                ...prev,
                [viewDate]: prev[viewDate].filter(t => t.id !== id)
                }));
            };

            // --- DATE NAVIGATION LOGIC ---
            const handlePrevDay = () => {
                const dates = Object.keys(tasksHistory).sort();
                const currentIndex = dates.indexOf(viewDate);
                if (currentIndex > 0) setViewDate(dates[currentIndex - 1]);
            };

            const handleNextDay = () => {
                const dates = Object.keys(tasksHistory).sort();
                const currentIndex = dates.indexOf(viewDate);
                if (currentIndex < dates.length - 1) setViewDate(dates[currentIndex + 1]);
            };

            // --- STICKY NOTES LOGIC ---
            const updateSticky = (id, title, content) => {
                setStickies(stickies.map(s => s.id === id ? { ...s, title, content } : s));
            };

            const archiveSticky = (stickyData) => {
                setArchivedStickies([stickyData, ...archivedStickies]);
            };

            const deleteSticky = (id) => {
                setStickies(stickies.filter(s => s.id !== id));
            };

            const addSticky = () => {
                const colors = [
                'bg-yellow-200 dark:bg-yellow-900/60', 
                'bg-teal-200 dark:bg-teal-900/60', 
                'bg-rose-200 dark:bg-rose-900/60', 
                'bg-purple-200 dark:bg-purple-900/60', 
                'bg-blue-200 dark:bg-blue-900/60', 
                'bg-orange-200 dark:bg-orange-900/60'
                ];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                const newSticky = { id: Date.now().toString(), color: randomColor, title: '', content: '' };
                setStickies([...stickies, newSticky]);
            };

            const columns = [
                { id: 'todo', title: 'To Do', color: 'bg-amber-100 dark:bg-amber-900/40', borderColor: 'border-amber-400 dark:border-amber-600', textColor: 'text-amber-800 dark:text-amber-200' },
                { id: 'in-progress', title: 'In Progress', color: 'bg-sky-100 dark:bg-sky-900/40', borderColor: 'border-sky-400 dark:border-sky-600', textColor: 'text-sky-800 dark:text-sky-200' },
                { id: 'done', title: 'Done', color: 'bg-emerald-100 dark:bg-emerald-900/40', borderColor: 'border-emerald-400 dark:border-emerald-600', textColor: 'text-emerald-800 dark:text-emerald-200' }
            ];

            const leftStickies = stickies.filter((_, i) => i % 2 === 0);
            const rightStickies = stickies.filter((_, i) => i % 2 !== 0);

            return (
                <div className={isDarkMode ? 'dark' : ''}>
                <div className="min-h-screen bg-gradient-to-br from-[#d4f0df] via-[#e2ddf8] to-[#d4f0df] dark:from-gray-900 dark:via-gray-800 dark:to-gray-900 font-sans p-4 md:p-8 overflow-hidden relative transition-colors duration-500 text-gray-800 dark:text-gray-200">
                    
                    {/* TAMPILAN ARSIP KERTAS SOBEK (MODAL) */}
                    {isArchiveOpen && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                        <div className="absolute inset-0 bg-black/40 dark:bg-black/60 backdrop-blur-sm" onClick={() => setIsArchiveOpen(false)}></div>
                        <div className="bg-white/90 dark:bg-gray-800/90 backdrop-blur-md w-full max-w-4xl max-h-[80vh] rounded-3xl shadow-2xl relative flex flex-col z-10 border border-white dark:border-gray-700">
                        <div className="p-6 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center bg-gray-50/50 dark:bg-gray-900/50 rounded-t-3xl">
                            <h2 className="text-2xl font-bold flex items-center gap-2 text-gray-800 dark:text-gray-100">
                            <Archive className="text-purple-500 dark:text-purple-400"/> Kumpulan Kertas Sobek
                            </h2>
                            <button onClick={() => setIsArchiveOpen(false)} className="p-2 bg-gray-200 dark:bg-gray-700 rounded-full hover:bg-red-200 dark:hover:bg-red-900/50 hover:text-red-600 dark:hover:text-red-400 transition-colors">
                            <X size={20} />
                            </button>
                        </div>
                        <div className="p-6 overflow-y-auto flex-1 hide-scrollbar">
                            {archivedStickies.length === 0 ? (
                            <div className="text-center text-gray-500 dark:text-gray-400 py-10">Belum ada kertas yang disobek.</div>
                            ) : (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                {archivedStickies.map((archive, i) => (
                                <div key={i} className={`${archive.color} p-4 rounded-br-[2rem] shadow-md transform rotate-[-2deg] opacity-80 hover:opacity-100 transition-opacity`}>
                                    <div className="text-xs text-gray-500 dark:text-gray-400 mb-2 border-b border-black/10 dark:border-white/10 pb-1">
                                    Disobek: {new Date(archive.tornAt).toLocaleDateString('id-ID')}
                                    </div>
                                    <div className="font-bold text-gray-800 dark:text-gray-100 mb-2">{archive.title || 'Tanpa Judul'}</div>
                                    <div className="text-gray-700 dark:text-gray-200 whitespace-pre-wrap text-sm">{archive.content || 'Kosong'}</div>
                                </div>
                                ))}
                            </div>
                            )}
                        </div>
                        </div>
                    </div>
                    )}

                    {/* Hiasan Latar Belakang */}
                    <div className="absolute top-10 left-[20%] text-4xl opacity-50 dark:opacity-20 animate-pulse">❤️</div>
                    <div className="absolute top-20 right-[25%] text-4xl opacity-50 dark:opacity-20 animate-bounce" style={{animationDuration: '3s'}}>💖</div>
                    <div className="absolute bottom-20 left-[30%] text-3xl opacity-40 dark:opacity-20">✨</div>

                    {/* HEADER & ARCHIVE BUTTON */}
                    <div className="flex justify-between items-start mb-6 relative z-10">
                    <div className="w-16 md:w-40 flex justify-start pt-2 pl-2">
                        {/* Tombol Dark Mode */}
                        <button 
                        onClick={() => setIsDarkMode(!isDarkMode)}
                        className="flex flex-col items-center group"
                        >
                        <div className="bg-white/60 dark:bg-gray-800/60 p-3 rounded-2xl shadow-lg border-2 border-white dark:border-gray-700 group-hover:scale-110 transition-transform group-hover:bg-yellow-100 dark:group-hover:bg-gray-700">
                            {isDarkMode ? <Moon size={28} className="text-blue-400" /> : <Sun size={28} className="text-yellow-500" />}
                        </div>
                        <span className="text-xs font-bold text-gray-600 dark:text-gray-400 mt-2 bg-white/50 dark:bg-gray-800/50 px-2 rounded-full">Tema</span>
                        </button>
                    </div>
                    
                    <div className="flex flex-col items-center flex-1">
                        <div className="bg-pink-200/80 dark:bg-pink-900/50 backdrop-blur-md px-12 py-4 rounded-3xl shadow-xl border border-pink-300 dark:border-pink-800 transform -rotate-2 hover:rotate-0 transition-transform duration-300 mb-4">
                        <h1 className="text-4xl md:text-5xl font-black text-gray-800 dark:text-gray-100 tracking-wide" style={{ fontFamily: '"Comic Sans MS", cursive, sans-serif' }}>
                            Follow Up List
                        </h1>
                        </div>
                    </div>

                    <div className="w-16 md:w-40 flex justify-end pt-2 pr-2">
                        <button 
                        onClick={() => setIsArchiveOpen(true)}
                        className="flex flex-col items-center group"
                        >
                        <div className="bg-white/60 dark:bg-gray-800/60 p-3 rounded-2xl shadow-lg border-2 border-white dark:border-gray-700 group-hover:scale-110 transition-transform group-hover:bg-purple-100 dark:group-hover:bg-gray-700">
                            <Archive size={28} className="text-purple-600 dark:text-purple-400" />
                        </div>
                        <span className="text-xs font-bold text-gray-600 dark:text-gray-400 mt-2 bg-white/50 dark:bg-gray-800/50 px-2 rounded-full">Arsip</span>
                        </button>
                    </div>
                    </div>

                    {/* KONTEN UTAMA: Grid Layout */}
                    <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 relative z-10">
                    
                    {/* SIDEBAR KIRI: Sticky Notes */}
                    <div className="lg:col-span-3 hidden lg:flex flex-col h-full">
                        <div className="flex-1 space-y-6 overflow-y-auto hide-scrollbar pb-10">
                        {leftStickies.map((sticky) => (
                            <TearableStickyNote 
                            key={sticky.id}
                            id={sticky.id}
                            initialColor={sticky.color}
                            initialTitle={sticky.title}
                            initialText={sticky.content}
                            onUpdate={updateSticky}
                            onTear={archiveSticky}
                            onDelete={deleteSticky}
                            />
                        ))}
                        <button 
                            onClick={addSticky}
                            className="w-full py-4 border-2 border-dashed border-gray-400/50 dark:border-gray-600/50 rounded-2xl text-gray-500 dark:text-gray-400 font-bold hover:bg-white/40 dark:hover:bg-gray-800/40 transition-colors flex items-center justify-center gap-2 shadow-sm"
                        >
                            <Plus size={20}/> Kertas Baru
                        </button>
                        </div>
                    </div>

                    {/* TENGAH: Kanban Board (Mesin Waktu) */}
                    <div className="lg:col-span-6 glass-panel rounded-[2rem] p-6 shadow-2xl flex flex-col min-h-[600px]">
                        
                        {/* NAVIGASI TANGGAL */}
                        <div className="flex items-center justify-between mb-6 bg-white/60 dark:bg-gray-800/60 rounded-full py-2 px-4 shadow-sm border border-white dark:border-gray-700">
                        <button 
                            onClick={handlePrevDay} 
                            disabled={Object.keys(tasksHistory).sort().indexOf(viewDate) === 0}
                            className="p-2 rounded-full hover:bg-purple-200 dark:hover:bg-purple-900/50 disabled:opacity-30 disabled:hover:bg-transparent transition-colors text-gray-700 dark:text-gray-300"
                        >
                            <ChevronLeft size={20} />
                        </button>
                        
                        <div className="flex items-center gap-2 font-bold text-gray-700 dark:text-gray-200">
                            <Calendar size={18} className="text-purple-500 dark:text-purple-400"/>
                            {viewDate === todayKey ? "Hari Ini" : formatDateDisplay(viewDate)}
                        </div>

                        <button 
                            onClick={handleNextDay}
                            disabled={Object.keys(tasksHistory).sort().indexOf(viewDate) === Object.keys(tasksHistory).length - 1}
                            className="p-2 rounded-full hover:bg-purple-200 dark:hover:bg-purple-900/50 disabled:opacity-30 disabled:hover:bg-transparent transition-colors text-gray-700 dark:text-gray-300"
                        >
                            <ChevronRight size={20} />
                        </button>
                        </div>

                        {/* Input Task Baru */}
                        {viewDate === todayKey ? (
                        <form onSubmit={addTask} className="mb-6 relative">
                            <input 
                            type="text" 
                            value={newTaskInput}
                            onChange={(e) => setNewTaskInput(e.target.value)}
                            placeholder="Tambahkan tugas follow up hari ini..."
                            className="w-full bg-white/70 dark:bg-gray-800/70 border-2 border-white dark:border-gray-700 focus:border-purple-300 dark:focus:border-purple-500 rounded-full py-3 px-6 pr-12 outline-none shadow-inner text-gray-700 dark:text-gray-200 transition-all placeholder-gray-400 dark:placeholder-gray-500 font-medium"
                            />
                            <button 
                            type="submit"
                            className="absolute right-2 top-2 bottom-2 bg-gradient-to-r from-purple-400 to-pink-400 dark:from-purple-600 dark:to-pink-600 text-white rounded-full p-2 hover:scale-110 transition-transform shadow-md"
                            >
                            <Plus size={20} />
                            </button>
                        </form>
                        ) : (
                        <div className="mb-6 p-3 bg-yellow-100/50 dark:bg-yellow-900/30 rounded-xl text-center text-sm font-medium text-yellow-800 dark:text-yellow-200 border border-yellow-200 dark:border-yellow-800/50">
                            Melihat histori tanggal {formatDateDisplay(viewDate)}. List disalin ke hari berikutnya.
                        </div>
                        )}

                        {/* Kolom Kanban */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 flex-1">
                        {columns.map(col => (
                            <div 
                            key={col.id} 
                            className="flex flex-col h-full min-h-[300px]"
                            onDragOver={handleDragOver}
                            onDrop={(e) => handleDrop(e, col.id)}
                            >
                            {/* Header Kolom */}
                            <div className={`flex items-center justify-between px-4 py-3 bg-white/80 dark:bg-gray-800/80 rounded-t-2xl border-t-4 ${col.borderColor} shadow-sm mb-3`}>
                                <h3 className={`font-bold ${col.textColor} flex items-center gap-2 text-sm`}>
                                {col.title}
                                </h3>
                                <span className={`text-xs font-bold bg-white dark:bg-gray-700 px-2 py-1 rounded-full shadow-sm ${col.textColor}`}>
                                {currentTasks.filter(t => t.status === col.id).length}
                                </span>
                            </div>

                            {/* Area Drop Task */}
                            <div className="flex-1 overflow-y-auto hide-scrollbar space-y-3 pb-4">
                                {currentTasks.filter(t => t.status === col.id).map(task => (
                                <div 
                                    key={task.id}
                                    draggable={viewDate === todayKey}
                                    onDragStart={(e) => handleDragStart(e, task.id)}
                                    onDragEnd={handleDragEnd}
                                    className="bg-white dark:bg-gray-800 p-3 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 cursor-grab active:cursor-grabbing hover:shadow-md hover:-translate-y-1 transition-all group relative"
                                >
                                    <div className="flex items-start gap-2">
                                    {viewDate === todayKey && (
                                        <div className="mt-1 text-gray-400 dark:text-gray-500 cursor-grab active:cursor-grabbing">
                                        <GripVertical size={14} />
                                        </div>
                                    )}
                                    <p className={`flex-1 text-sm font-medium ${col.id === 'done' ? 'line-through text-gray-400 dark:text-gray-500' : 'text-gray-700 dark:text-gray-200'}`}>
                                        {task.content}
                                    </p>
                                    
                                    {/* Tombol Hapus */}
                                    <button 
                                        onClick={() => deleteTask(task.id)}
                                        className="opacity-0 group-hover:opacity-100 text-gray-300 dark:text-gray-500 hover:text-red-500 dark:hover:text-red-400 transition-opacity"
                                    >
                                        <Trash2 size={14} />
                                    </button>
                                    </div>
                                </div>
                                ))}
                                
                                {/* Empty State indicator */}
                                {currentTasks.filter(t => t.status === col.id).length === 0 && (
                                <div className="border-2 border-dashed border-gray-300/50 dark:border-gray-600/50 rounded-xl h-20 flex items-center justify-center text-gray-400 dark:text-gray-500 text-xs font-medium">
                                    Kosong
                                </div>
                                )}
                            </div>
                            </div>
                        ))}
                        </div>

                    </div>

                    {/* SIDEBAR KANAN: Sticky Notes & Info */}
                    <div className="lg:col-span-3 hidden lg:flex flex-col h-full">
                        <div className="flex-1 space-y-6 overflow-y-auto hide-scrollbar pb-10">
                        {rightStickies.map((sticky) => (
                            <TearableStickyNote 
                            key={sticky.id}
                            id={sticky.id}
                            initialColor={sticky.color}
                            initialTitle={sticky.title}
                            initialText={sticky.content}
                            onUpdate={updateSticky}
                            onTear={archiveSticky}
                            onDelete={deleteSticky}
                            />
                        ))}
                        
                        {/* Info Box */}
                        <div className="glass-panel p-4 rounded-2xl text-xs text-gray-600 dark:text-gray-300 shadow-lg">
                            <h4 className="font-bold mb-2 flex items-center gap-2 text-sm text-gray-800 dark:text-gray-100">
                            <PenTool size={14}/> Sistem Mesin Waktu
                            </h4>
                            <ul className="list-disc pl-4 space-y-1">
                            <li>Saat berganti hari, tugas yang <span className="text-emerald-600 dark:text-emerald-400 font-bold">Done</span> akan ditinggalkan di histori hari sebelumnya.</li>
                            <li>Tugas yang belum selesai otomatis diwariskan ke hari ini.</li>
                            <li>Kertas yang disobek akan disembunyikan ke ikon <b>Arsip</b> di kanan atas.</li>
                            </ul>
                        </div>
                        </div>
                    </div>

                    {/* Tampilan Mobile: Sticky Notes & Info Box */}
                    <div className="col-span-1 lg:hidden mt-4 space-y-6">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {stickies.map((sticky) => (
                            <TearableStickyNote 
                            key={`mobile-${sticky.id}`}
                            id={sticky.id}
                            initialColor={sticky.color}
                            initialTitle={sticky.title}
                            initialText={sticky.content}
                            onUpdate={updateSticky}
                            onTear={archiveSticky}
                            onDelete={deleteSticky}
                            />
                        ))}
                        </div>
                        <button 
                            onClick={addSticky}
                            className="w-full py-4 border-2 border-dashed border-gray-400/50 dark:border-gray-600/50 rounded-2xl text-gray-500 dark:text-gray-400 font-bold hover:bg-white/40 dark:hover:bg-gray-800/40 transition-colors flex items-center justify-center gap-2 shadow-sm"
                        >
                            <Plus size={20}/> Kertas Baru
                        </button>
                    </div>

                    </div>
                </div>
                </div>
            );
        }

        // --- RENDER APLIKASI ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
