<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Follow Up List - Stempel Absurd & Resizable</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Custom CSS -->
    <style>
        @keyframes tearOff {
            0% { transform: rotate(0deg) translateY(0) scale(1); opacity: 1; transform-origin: top left; filter: drop-shadow(0 10px 8px rgb(0 0 0 / 0.04)); }
            20% { transform: rotate(-5deg) translateY(10px) scale(1.05); filter: drop-shadow(0 20px 13px rgb(0 0 0 / 0.1)); }
            100% { transform: rotate(-35deg) translateY(800px) scale(0.9); opacity: 0; filter: drop-shadow(0 0px 0px rgb(0 0 0 / 0)); }
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        .sticky-tear-animation { animation: tearOff 0.8s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards; pointer-events: none; z-index: 50; }
        .pop-in-animation { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            transition: all 0.3s ease;
        }
        
        .dark .glass-panel {
            background: rgba(31, 41, 55, 0.4);
            border: 1px solid rgba(75, 85, 99, 0.6);
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- IKON SVG INLINE ---
        const Icon = ({ size = 24, className = "", children }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></Icon>;
        const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></Icon>;
        const Minus = (p) => <Icon {...p}><line x1="5" y1="12" x2="19" y2="12"></line></Icon>;
        const RotateCcw = (p) => <Icon {...p}><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></Icon>;
        const Trash2 = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></Icon>;
        const Archive = (p) => <Icon {...p}><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></Icon>;
        const ChevronLeft = (p) => <Icon {...p}><polyline points="15 18 9 12 15 6"></polyline></Icon>;
        const ChevronRight = (p) => <Icon {...p}><polyline points="9 18 15 12 9 6"></polyline></Icon>;
        const Calendar = (p) => <Icon {...p}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></Icon>;
        const Sun = (p) => <Icon {...p}><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></Icon>;
        const Moon = (p) => <Icon {...p}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></Icon>;
        const PenTool = (p) => <Icon {...p}><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></Icon>;
        const GripVertical = (p) => <Icon {...p}><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="5" r="1"></circle><circle cx="9" cy="19" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="5" r="1"></circle><circle cx="15" cy="19" r="1"></circle></Icon>;

        // --- HELPER UNTUK TANGGAL & GAMBAR ---
        const getTodayKey = () => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        const formatDateDisplay = (dateStr) => {
            if (!dateStr) return '';
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateStr).toLocaleDateString('id-ID', options);
        };

        const resizeImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 150; 
                        let width = img.width;
                        let height = img.height;
                        
                        if (width > height) {
                            if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                        } else {
                            if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                        }
                        
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/png'));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        };

        // --- KOMPONEN: STEMPEL YANG BISA DIGESER & DIUKUR ---
        const DraggableSticker = ({ sticker, onMove, onDelete, onResize }) => {
            const [pos, setPos] = useState({ x: sticker.x, y: sticker.y });
            const [isDragging, setIsDragging] = useState(false);
            const dragInfo = useRef({ startX: 0, startY: 0, origX: 0, origY: 0 });
            
            const scale = sticker.scale || 1;

            const handlePointerDown = (e) => {
                e.preventDefault(); 
                setIsDragging(true);
                dragInfo.current = {
                    startX: e.clientX,
                    startY: e.clientY,
                    origX: pos.x,
                    origY: pos.y
                };
            };

            useEffect(() => {
                const handlePointerMove = (e) => {
                    if (!isDragging) return;
                    const dx = e.clientX - dragInfo.current.startX;
                    const dy = e.clientY - dragInfo.current.startY;
                    setPos({ x: dragInfo.current.origX + dx, y: dragInfo.current.origY + dy });
                };
                const handlePointerUp = () => {
                    if (isDragging) {
                        setIsDragging(false);
                        onMove(sticker.id, pos.x, pos.y); 
                    }
                };

                if (isDragging) {
                    window.addEventListener('pointermove', handlePointerMove);
                    window.addEventListener('pointerup', handlePointerUp);
                }
                return () => {
                    window.removeEventListener('pointermove', handlePointerMove);
                    window.removeEventListener('pointerup', handlePointerUp);
                };
            }, [isDragging, pos, sticker.id, onMove]);

            const handleIncrease = (e) => {
                e.stopPropagation();
                onResize(sticker.id, scale + 0.2); // Tambah ukuran
            };

            const handleDecrease = (e) => {
                e.stopPropagation();
                onResize(sticker.id, Math.max(0.4, scale - 0.2)); // Kurangi ukuran, minimal 0.4
            };

            return (
                <div
                    style={{ left: pos.x, top: pos.y, position: 'absolute' }}
                    className="cursor-move group z-40 pop-in-animation touch-none flex flex-col items-center justify-center"
                    onPointerDown={handlePointerDown}
                >
                    {/* Toolbar Pengatur Ukuran & Hapus (Muncul saat Hover) */}
                    <div 
                        className="absolute -top-12 opacity-0 group-hover:opacity-100 transition-opacity duration-200 flex items-center gap-1 bg-white dark:bg-gray-800 p-1.5 rounded-full shadow-lg border border-gray-200 dark:border-gray-600 z-50"
                        onPointerDown={(e) => e.stopPropagation()} // Cegah drag saat klik tombol toolbar
                    >
                        <button onClick={handleDecrease} className="p-1 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full text-gray-600 dark:text-gray-300 transition-colors" title="Perkecil">
                            <Minus size={16}/>
                        </button>
                        <button onClick={handleIncrease} className="p-1 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full text-gray-600 dark:text-gray-300 transition-colors" title="Perbesar">
                            <Plus size={16}/>
                        </button>
                        <div className="w-px h-5 bg-gray-300 dark:bg-gray-600 mx-1"></div>
                        <button onClick={(e) => { e.stopPropagation(); onDelete(sticker.id); }} className="p-1 hover:bg-red-100 dark:hover:bg-red-900/40 text-red-500 rounded-full transition-colors" title="Hapus">
                            <X size={16} />
                        </button>
                    </div>
                    
                    {/* Konten Stiker / Stempel */}
                    <div style={{ transform: `rotate(${sticker.rotation || 0}deg)` }} className="relative flex justify-center items-center">
                        {sticker.type === 'image' ? (
                            <img src={sticker.content} style={{ width: `${80 * scale}px`, height: `${80 * scale}px` }} className="object-contain pointer-events-none drop-shadow-md select-none transition-all duration-200" draggable="false" />
                        ) : (
                            <span style={{ fontSize: `${48 * scale}px`, lineHeight: 1 }} className="pointer-events-none select-none drop-shadow-md block transition-all duration-200">
                                {sticker.content}
                            </span>
                        )}
                    </div>
                </div>
            );
        };


        // --- KOMPONEN: STICKY NOTE ABSURD ---
        const TearableStickyNote = ({ id, initialColor, initialTitle, initialText, onUpdate, onTear, onDelete }) => {
            const [isTearing, setIsTearing] = useState(false);
            const [content, setContent] = useState(initialText);
            const [title, setTitle] = useState(initialTitle);
            const noteRef = useRef(null);

            const handleTear = () => {
                if (!title && !content) return;
                setIsTearing(true);
                onTear({ id, title, content, color: initialColor, tornAt: new Date().toISOString() });

                setTimeout(() => {
                    setContent(''); setTitle(''); setIsTearing(false);
                    onUpdate(id, '', '');
                }, 800);
            };

            const handleChange = (e) => { setContent(e.target.value); onUpdate(id, title, e.target.value); };
            const handleTitleChange = (e) => { setTitle(e.target.value); onUpdate(id, e.target.value, content); };

            return (
                <div className="relative mb-6">
                    {isTearing && (
                        <div className={`absolute inset-0 ${initialColor} shadow-md rounded-br-3xl p-4 flex flex-col z-0 opacity-50`}>
                            <div className="font-bold text-gray-800 mb-2">{title}</div>
                            <div className="flex-1 border-dashed border-2 border-black/10 rounded"></div>
                        </div>
                    )}
                    <div ref={noteRef} className={`${initialColor} shadow-lg hover:shadow-xl transition-all duration-300 rounded-br-[2rem] p-4 flex flex-col min-h-[200px] relative z-10 group ${isTearing ? 'sticky-tear-animation' : ''}`}>
                        <div className="absolute bottom-0 right-0 w-8 h-8 bg-black/10 rounded-tl-[2rem] rounded-br-[2rem]"></div>
                        <button onClick={() => onDelete(id)} className="absolute -top-2 -right-2 bg-red-400 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity shadow-md hover:bg-red-500 z-20">
                            <X size={14} />
                        </button>
                        <div className="flex justify-between items-center mb-2 border-b border-black/10 pb-2">
                            <input type="text" value={title} onChange={handleTitleChange} className="font-bold text-gray-800 bg-transparent outline-none w-full placeholder-gray-500" placeholder="Judul..."/>
                            <button onClick={handleTear} title="Sobek & Simpan di Arsip!" className="text-gray-500 hover:text-red-500 transition-colors p-1 rounded-full hover:bg-black/5">
                                <RotateCcw size={16} />
                            </button>
                        </div>
                        <textarea value={content} onChange={handleChange} className="flex-1 w-full bg-transparent outline-none resize-none text-gray-700 leading-relaxed hide-scrollbar placeholder-gray-400" placeholder="Tulis sesuatu..."/>
                    </div>
                </div>
            );
        };

        // --- KOMPONEN UTAMA APLIKASI ---
        function App() {
            const todayKey = getTodayKey();

            // 1. STATE DASAR
            const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('followUpDarkMode') === 'true');
            const [tasksHistory, setTasksHistory] = useState(() => {
                const saved = localStorage.getItem('followUpTasksHistory_v4');
                return saved ? JSON.parse(saved) : { [todayKey]: [] };
            });
            const [viewDate, setViewDate] = useState(todayKey);
            const [stickies, setStickies] = useState(() => {
                const saved = localStorage.getItem('followUpStickies_v5'); // Ganti key storage
                return saved ? JSON.parse(saved) : [
                    { id: 's1', color: 'bg-yellow-200', title: '', content: '' },
                    { id: 's2', color: 'bg-rose-200', title: '', content: '' },
                ];
            });
            const [archivedStickies, setArchivedStickies] = useState(() => {
                const saved = localStorage.getItem('followUpArchivedStickies_v4');
                return saved ? JSON.parse(saved) : [];
            });

            // 2. STATE STIKER/STEMPEL
            const defaultStickers = [
                { id: 'd1', type: 'emoji', content: '❤️' },
                { id: 'd2', type: 'emoji', content: '👍' },
                { id: 'd3', type: 'emoji', content: '🔥' },
                { id: 'd4', type: 'emoji', content: '✨' },
                { id: 'd5', type: 'emoji', content: '😂' },
                { id: 'd6', type: 'emoji', content: '📌' },
                { id: 'd7', type: 'emoji', content: '👀' },
            ];
            const [customStickersRepo, setCustomStickersRepo] = useState(() => {
                const saved = localStorage.getItem('followUpCustomStickers');
                return saved ? JSON.parse(saved) : [];
            });
            const [placedStickers, setPlacedStickers] = useState(() => {
                const saved = localStorage.getItem('followUpPlacedStickers_v2'); // Update key
                return saved ? JSON.parse(saved) : [];
            });

            const [isArchiveOpen, setIsArchiveOpen] = useState(false);
            const [newTaskInput, setNewTaskInput] = useState('');
            const [draggedTaskId, setDraggedTaskId] = useState(null);

            // --- EFEK PERGANTIAN HARI ---
            useEffect(() => {
                const checkAndShiftDay = () => {
                    setTasksHistory(prevHistory => {
                        const historyKeys = Object.keys(prevHistory).sort();
                        if (!prevHistory[todayKey]) {
                            const lastDateKey = historyKeys[historyKeys.length - 1];
                            let carryOverTasks = [];
                            if (lastDateKey && prevHistory[lastDateKey]) {
                                carryOverTasks = prevHistory[lastDateKey]
                                    .filter(task => task.status !== 'done')
                                    .map(task => ({ ...task, id: `carry-${Date.now()}-${Math.random()}` }));
                            }
                            return { ...prevHistory, [todayKey]: carryOverTasks };
                        }
                        return prevHistory;
                    });
                    setViewDate(todayKey);
                };
                checkAndShiftDay();
            }, [todayKey]);

            // --- SAVE TO LOCAL STORAGE ---
            useEffect(() => { localStorage.setItem('followUpDarkMode', isDarkMode); }, [isDarkMode]);
            useEffect(() => { localStorage.setItem('followUpTasksHistory_v4', JSON.stringify(tasksHistory)); }, [tasksHistory]);
            useEffect(() => { localStorage.setItem('followUpStickies_v5', JSON.stringify(stickies)); }, [stickies]);
            useEffect(() => { localStorage.setItem('followUpArchivedStickies_v4', JSON.stringify(archivedStickies)); }, [archivedStickies]);
            useEffect(() => { localStorage.setItem('followUpCustomStickers', JSON.stringify(customStickersRepo)); }, [customStickersRepo]);
            useEffect(() => { localStorage.setItem('followUpPlacedStickers_v2', JSON.stringify(placedStickers)); }, [placedStickers]);


            // --- LOGIKA STEMPEL ---
            const handleUploadSticker = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const resizedBase64 = await resizeImage(file);
                const newSticker = { id: `custom-${Date.now()}`, type: 'image', content: resizedBase64 };
                setCustomStickersRepo([...customStickersRepo, newSticker]);
                e.target.value = ''; 
            };

            const spawnSticker = (stickerTemplate) => {
                const newPlaced = {
                    id: `placed-${Date.now()}-${Math.random()}`,
                    type: stickerTemplate.type,
                    content: stickerTemplate.content,
                    x: (window.innerWidth / 2) - 30 + (Math.random() * 40 - 20),
                    y: (window.innerHeight / 2) - 30 + (Math.random() * 40 - 20),
                    rotation: Math.random() * 20 - 10,
                    scale: 1 // Ukuran default
                };
                setPlacedStickers([...placedStickers, newPlaced]);
            };

            const updatePlacedStickerPosition = (id, newX, newY) => {
                setPlacedStickers(prev => prev.map(s => s.id === id ? { ...s, x: newX, y: newY } : s));
            };

            // LOGIKA BARU: Merubah ukuran (Scale)
            const updatePlacedStickerScale = (id, newScale) => {
                setPlacedStickers(prev => prev.map(s => s.id === id ? { ...s, scale: newScale } : s));
            };

            const deletePlacedSticker = (id) => {
                setPlacedStickers(prev => prev.filter(s => s.id !== id));
            };

            const deleteCustomStickerRepo = (id, e) => {
                e.stopPropagation();
                setCustomStickersRepo(prev => prev.filter(s => s.id !== id));
            }


            // --- KANBAN LOGIC ---
            const currentTasks = tasksHistory[viewDate] || [];
            const handleDragStart = (e, id) => { setDraggedTaskId(id); setTimeout(() => { e.target.style.opacity = '0.4'; }, 0); };
            const handleDragEnd = (e) => { e.target.style.opacity = '1'; setDraggedTaskId(null); };
            const handleDragOver = (e) => e.preventDefault();
            const handleDrop = (e, status) => {
                e.preventDefault();
                if (draggedTaskId) {
                    setTasksHistory(prev => ({ ...prev, [viewDate]: prev[viewDate].map(task => task.id === draggedTaskId ? { ...task, status } : task) }));
                }
            };
            const addTask = (e) => {
                e.preventDefault();
                if (!newTaskInput.trim()) return;
                const newTask = { id: Date.now().toString(), content: newTaskInput, status: 'todo' };
                setTasksHistory(prev => ({ ...prev, [viewDate]: [newTask, ...(prev[viewDate] || [])] }));
                setNewTaskInput('');
            };
            const deleteTask = (id) => { setTasksHistory(prev => ({ ...prev, [viewDate]: prev[viewDate].filter(t => t.id !== id) })); };

            // --- NAVIGASI ---
            const handlePrevDay = () => {
                const dates = Object.keys(tasksHistory).sort();
                const currentIndex = dates.indexOf(viewDate);
                if (currentIndex > 0) setViewDate(dates[currentIndex - 1]);
            };
            const handleNextDay = () => {
                const dates = Object.keys(tasksHistory).sort();
                const currentIndex = dates.indexOf(viewDate);
                if (currentIndex < dates.length - 1) setViewDate(dates[currentIndex + 1]);
            };

            // --- STICKY NOTES LOGIC ---
            const updateSticky = (id, title, content) => { setStickies(stickies.map(s => s.id === id ? { ...s, title, content } : s)); };
            const archiveSticky = (stickyData) => { setArchivedStickies([stickyData, ...archivedStickies]); };
            const deleteSticky = (id) => { setStickies(stickies.filter(s => s.id !== id)); };
            const addSticky = () => {
                const colors = ['bg-yellow-200', 'bg-teal-200', 'bg-rose-200', 'bg-purple-200', 'bg-blue-200', 'bg-orange-200'];
                const newSticky = { id: Date.now().toString(), color: colors[Math.floor(Math.random() * colors.length)], title: '', content: '' };
                setStickies([...stickies, newSticky]);
            };

            const columns = [
                { id: 'todo', title: 'To Do', color: 'bg-amber-100 dark:bg-amber-900/40', borderColor: 'border-amber-400 dark:border-amber-600', textColor: 'text-amber-800 dark:text-amber-200' },
                { id: 'in-progress', title: 'In Progress', color: 'bg-sky-100 dark:bg-sky-900/40', borderColor: 'border-sky-400 dark:border-sky-600', textColor: 'text-sky-800 dark:text-sky-200' },
                { id: 'done', title: 'Done', color: 'bg-emerald-100 dark:bg-emerald-900/40', borderColor: 'border-emerald-400 dark:border-emerald-600', textColor: 'text-emerald-800 dark:text-emerald-200' }
            ];

            return (
                <div className={isDarkMode ? 'dark' : ''}>
                    {/* CONTAINER UTAMA - RELATIVE UNTUK STEMPEL */}
                    <div className="min-h-screen bg-gradient-to-br from-[#d4f0df] via-[#e2ddf8] to-[#d4f0df] dark:from-gray-900 dark:via-gray-800 dark:to-gray-900 font-sans p-4 md:p-8 overflow-hidden relative transition-colors duration-500 text-gray-800 dark:text-gray-200">
                        
                        {/* --- RENDER SEMUA STEMPEL YANG DITEMPEL --- */}
                        {placedStickers.map(sticker => (
                            <DraggableSticker 
                                key={sticker.id} 
                                sticker={sticker} 
                                onMove={updatePlacedStickerPosition} 
                                onDelete={deletePlacedSticker} 
                                onResize={updatePlacedStickerScale}
                            />
                        ))}

                        {/* TAMPILAN ARSIP */}
                        {isArchiveOpen && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                                <div className="absolute inset-0 bg-black/40 dark:bg-black/60 backdrop-blur-sm" onClick={() => setIsArchiveOpen(false)}></div>
                                <div className="bg-white/90 dark:bg-gray-800/90 backdrop-blur-md w-full max-w-4xl max-h-[80vh] rounded-3xl shadow-2xl relative flex flex-col z-10 border border-white dark:border-gray-700 pop-in-animation">
                                    <div className="p-6 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center bg-gray-50/50 dark:bg-gray-900/50 rounded-t-3xl">
                                        <h2 className="text-2xl font-bold flex items-center gap-2 text-gray-800 dark:text-gray-100"><Archive className="text-purple-500 dark:text-purple-400"/> Arsip Kertas</h2>
                                        <button onClick={() => setIsArchiveOpen(false)} className="p-2 bg-gray-200 dark:bg-gray-700 rounded-full hover:bg-red-200 dark:hover:bg-red-900/50 hover:text-red-600 dark:hover:text-red-400"><X size={20} /></button>
                                    </div>
                                    <div className="p-6 overflow-y-auto flex-1 hide-scrollbar">
                                        {archivedStickies.length === 0 ? (
                                            <div className="text-center text-gray-500 py-10">Belum ada kertas yang disobek.</div>
                                        ) : (
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                                {archivedStickies.map((archive, i) => (
                                                    <div key={i} className={`${archive.color} p-4 rounded-br-[2rem] shadow-md transform rotate-[-2deg] opacity-80 hover:opacity-100`}>
                                                        <div className="text-xs text-gray-500 mb-2 border-b border-black/10 pb-1">Disobek: {new Date(archive.tornAt).toLocaleDateString('id-ID')}</div>
                                                        <div className="font-bold mb-2">{archive.title || 'Tanpa Judul'}</div>
                                                        <div className="whitespace-pre-wrap text-sm">{archive.content || 'Kosong'}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Hiasan Latar Belakang Dasar */}
                        <div className="absolute top-10 left-[20%] text-4xl opacity-50 dark:opacity-20 animate-pulse select-none pointer-events-none">❤️</div>
                        <div className="absolute top-20 right-[25%] text-4xl opacity-50 dark:opacity-20 animate-bounce select-none pointer-events-none" style={{animationDuration: '3s'}}>💖</div>
                        <div className="absolute bottom-32 left-[30%] text-3xl opacity-40 dark:opacity-20 select-none pointer-events-none">✨</div>

                        {/* HEADER & TOMBOL ATAS */}
                        <div className="flex justify-between items-start mb-6 relative z-10">
                            <div className="w-16 md:w-40 flex justify-start pt-2 pl-2">
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="flex flex-col items-center group">
                                    <div className="bg-white/60 dark:bg-gray-800/60 p-3 rounded-2xl shadow-lg border-2 border-white dark:border-gray-700 group-hover:scale-110 transition-transform"><Sun size={24} className={isDarkMode ? "hidden" : "block text-yellow-500"} /><Moon size={24} className={isDarkMode ? "block text-blue-400" : "hidden"} /></div>
                                    <span className="text-xs font-bold text-gray-600 dark:text-gray-400 mt-2 bg-white/50 dark:bg-gray-800/50 px-2 rounded-full">Tema</span>
                                </button>
                            </div>
                            
                            <div className="flex flex-col items-center flex-1 pointer-events-none">
                                <div className="bg-pink-200/80 dark:bg-pink-900/50 backdrop-blur-md px-12 py-4 rounded-3xl shadow-xl border border-pink-300 dark:border-pink-800 transform -rotate-2 hover:rotate-0 transition-transform duration-300 mb-4 pointer-events-auto">
                                    <h1 className="text-4xl md:text-5xl font-black text-gray-800 dark:text-gray-100 tracking-wide" style={{ fontFamily: '"Comic Sans MS", cursive, sans-serif' }}>Follow Up List</h1>
                                </div>
                            </div>

                            <div className="w-16 md:w-40 flex justify-end pt-2 pr-2">
                                <button onClick={() => setIsArchiveOpen(true)} className="flex flex-col items-center group">
                                    <div className="bg-white/60 dark:bg-gray-800/60 p-3 rounded-2xl shadow-lg border-2 border-white dark:border-gray-700 group-hover:scale-110 transition-transform"><Archive size={24} className="text-purple-600 dark:text-purple-400" /></div>
                                    <span className="text-xs font-bold text-gray-600 dark:text-gray-400 mt-2 bg-white/50 dark:bg-gray-800/50 px-2 rounded-full">Arsip</span>
                                </button>
                            </div>
                        </div>

                        {/* KONTEN UTAMA */}
                        <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 relative z-10 pb-24">
                            
                            {/* KIRI */}
                            <div className="lg:col-span-3 hidden lg:flex flex-col h-full z-10">
                                <div className="flex-1 space-y-6 overflow-y-auto hide-scrollbar pb-10">
                                    {stickies.filter((_, i) => i % 2 === 0).map((s) => <TearableStickyNote key={s.id} {...s} initialColor={s.color} initialTitle={s.title} initialText={s.content} onUpdate={updateSticky} onTear={archiveSticky} onDelete={deleteSticky} />)}
                                    <button onClick={addSticky} className="w-full py-4 border-2 border-dashed border-gray-400/50 dark:border-gray-600/50 rounded-2xl text-gray-500 font-bold hover:bg-white/40 dark:hover:bg-gray-800/40 transition-colors flex items-center justify-center gap-2"><Plus size={20}/> Kertas Baru</button>
                                </div>
                            </div>

                            {/* TENGAH (KANBAN) */}
                            <div className="lg:col-span-6 glass-panel rounded-[2rem] p-6 shadow-2xl flex flex-col min-h-[500px] z-10">
                                <div className="flex items-center justify-between mb-6 bg-white/60 dark:bg-gray-800/60 rounded-full py-2 px-4 shadow-sm border border-white dark:border-gray-700">
                                    <button onClick={handlePrevDay} disabled={Object.keys(tasksHistory).sort().indexOf(viewDate) === 0} className="p-2 rounded-full hover:bg-purple-200 dark:hover:bg-purple-900/50 disabled:opacity-30"><ChevronLeft size={20} /></button>
                                    <div className="flex items-center gap-2 font-bold text-gray-700 dark:text-gray-200"><Calendar size={18} className="text-purple-500 dark:text-purple-400"/> {viewDate === todayKey ? "Hari Ini" : formatDateDisplay(viewDate)}</div>
                                    <button onClick={handleNextDay} disabled={Object.keys(tasksHistory).sort().indexOf(viewDate) === Object.keys(tasksHistory).length - 1} className="p-2 rounded-full hover:bg-purple-200 dark:hover:bg-purple-900/50 disabled:opacity-30"><ChevronRight size={20} /></button>
                                </div>

                                {viewDate === todayKey ? (
                                    <form onSubmit={addTask} className="mb-6 relative">
                                        <input type="text" value={newTaskInput} onChange={(e) => setNewTaskInput(e.target.value)} placeholder="Tambahkan tugas..." className="w-full bg-white/70 dark:bg-gray-800/70 border-2 border-white dark:border-gray-700 focus:border-purple-300 dark:focus:border-purple-500 rounded-full py-3 px-6 pr-12 outline-none shadow-inner text-gray-700 dark:text-gray-200 font-medium"/>
                                        <button type="submit" className="absolute right-2 top-2 bottom-2 bg-gradient-to-r from-purple-400 to-pink-400 text-white rounded-full p-2 hover:scale-110 shadow-md"><Plus size={20} /></button>
                                    </form>
                                ) : (
                                    <div className="mb-6 p-3 bg-yellow-100/50 dark:bg-yellow-900/30 rounded-xl text-center text-sm font-medium text-yellow-800 dark:text-yellow-200 border border-yellow-200 dark:border-yellow-800/50">Melihat histori tanggal {formatDateDisplay(viewDate)}. List otomatis disalin ke hari berikutnya.</div>
                                )}

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 flex-1">
                                    {columns.map(col => (
                                        <div key={col.id} className="flex flex-col h-full min-h-[250px]" onDragOver={handleDragOver} onDrop={(e) => handleDrop(e, col.id)}>
                                            <div className={`flex items-center justify-between px-4 py-3 bg-white/80 dark:bg-gray-800/80 rounded-t-2xl border-t-4 ${col.borderColor} shadow-sm mb-3`}>
                                                <h3 className={`font-bold ${col.textColor} flex items-center gap-2 text-sm`}>{col.title}</h3>
                                                <span className={`text-xs font-bold bg-white dark:bg-gray-700 px-2 py-1 rounded-full shadow-sm ${col.textColor}`}>{currentTasks.filter(t => t.status === col.id).length}</span>
                                            </div>
                                            <div className="flex-1 overflow-y-auto hide-scrollbar space-y-3 pb-4">
                                                {currentTasks.filter(t => t.status === col.id).map(task => (
                                                    <div key={task.id} draggable={viewDate === todayKey} onDragStart={(e) => handleDragStart(e, task.id)} onDragEnd={handleDragEnd} className="bg-white dark:bg-gray-800 p-3 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 cursor-grab hover:shadow-md hover:-translate-y-1 transition-all group relative">
                                                        <div className="flex items-start gap-2">
                                                            {viewDate === todayKey && <div className="mt-1 text-gray-400 cursor-grab"><GripVertical size={14} /></div>}
                                                            <p className={`flex-1 text-sm font-medium ${col.id === 'done' ? 'line-through text-gray-400' : 'text-gray-700 dark:text-gray-200'}`}>{task.content}</p>
                                                            <button onClick={() => deleteTask(task.id)} className="opacity-0 group-hover:opacity-100 text-gray-300 hover:text-red-500 transition-opacity"><Trash2 size={14} /></button>
                                                        </div>
                                                    </div>
                                                ))}
                                                {currentTasks.filter(t => t.status === col.id).length === 0 && <div className="border-2 border-dashed border-gray-300/50 dark:border-gray-600/50 rounded-xl h-16 flex items-center justify-center text-gray-400 text-xs font-medium">Kosong</div>}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* KANAN */}
                            <div className="lg:col-span-3 hidden lg:flex flex-col h-full z-10">
                                <div className="flex-1 space-y-6 overflow-y-auto hide-scrollbar pb-10">
                                    {stickies.filter((_, i) => i % 2 !== 0).map((s) => <TearableStickyNote key={s.id} {...s} initialColor={s.color} initialTitle={s.title} initialText={s.content} onUpdate={updateSticky} onTear={archiveSticky} onDelete={deleteSticky} />)}
                                </div>
                            </div>
                        </div>

                        {/* --- DOCK STEMPEL / STIKER (FIXED BOTTOM) --- */}
                        <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-white/70 dark:bg-gray-800/70 backdrop-blur-xl px-4 py-3 rounded-2xl shadow-[0_20px_50px_rgba(8,_112,_184,_0.2)] dark:shadow-[0_20px_50px_rgba(0,_0,_0,_0.5)] border border-white/60 dark:border-gray-600/50 flex items-center gap-3 z-50 transition-all overflow-x-auto max-w-[90vw] hide-scrollbar">
                            <span className="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider mr-1 hidden sm:block">Stempel:</span>
                            
                            {/* Stiker Default Emoji */}
                            {defaultStickers.map(sticker => (
                                <button key={sticker.id} onClick={() => spawnSticker(sticker)} className="text-3xl hover:scale-125 transition-transform hover:-translate-y-2 focus:outline-none drop-shadow-sm" title="Klik untuk menempel">
                                    {sticker.content}
                                </button>
                            ))}

                            {/* Separator */}
                            <div className="w-px h-8 bg-gray-300 dark:bg-gray-600 mx-1"></div>

                            {/* Stiker Custom User */}
                            {customStickersRepo.map(sticker => (
                                <div key={sticker.id} className="relative group">
                                    <button onClick={() => spawnSticker(sticker)} className="w-10 h-10 rounded-lg overflow-hidden hover:scale-125 transition-transform hover:-translate-y-2 border-2 border-transparent hover:border-purple-300 dark:hover:border-purple-500 focus:outline-none shadow-sm bg-white dark:bg-gray-700 flex items-center justify-center">
                                        <img src={sticker.content} className="w-full h-full object-cover" />
                                    </button>
                                    <button onClick={(e) => deleteCustomStickerRepo(sticker.id, e)} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-0.5 opacity-0 group-hover:opacity-100 shadow-md hover:scale-110 z-10">
                                        <X size={10} />
                                    </button>
                                </div>
                            ))}

                            {/* Tombol Upload Stiker Baru */}
                            <label className="cursor-pointer hover:scale-110 transition-transform flex items-center justify-center w-10 h-10 bg-purple-100 dark:bg-purple-900/50 rounded-xl text-purple-600 dark:text-purple-400 border border-purple-200 dark:border-purple-700/50 shadow-inner hover:-translate-y-1" title="Tambah Stiker/Gambar Sendiri">
                                <input type="file" accept="image/*" className="hidden" onChange={handleUploadSticker} />
                                <Plus size={20} />
                            </label>
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
